<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Inventory Capture{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fafafa; }
    h1 { margin-top: 0; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #eee; }
    tr.highlight { background: #fff8c4; }
    form.filters, form.inline { display: inline-block; margin: 0; }
    form.filters { margin-bottom: 1rem; }
    .form-grid label { display: block; margin-top: 0.75rem; font-weight: 600; }
    .form-grid h2 { margin-top: 1.5rem; margin-bottom: 0.25rem; font-size: 1rem; border-top: 1px solid #ddd; padding-top: 1rem; }
    .form-grid input[type=text], .form-grid select, .form-grid textarea { width: 100%; max-width: 30rem; padding: 0.3rem; box-sizing: border-box; }
    .actions { margin-top: 1.5rem; }
    .error { color: #b00020; font-weight: 600; }
    .btn { display: inline-block; padding: 0.5rem 1rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
    select.quick { font-size: 0.85rem; }
    .danger-link { color: #b00020; margin-left: 0.75rem; }
    .btn-danger { background: #b00020; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Inventory</a>
    <a href="/items/new">Add item</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
